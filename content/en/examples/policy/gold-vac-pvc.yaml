---
{
  apiVersion: "v1",
  kind: "PersistentVolumeClaim",
  metadata: {
    name: "gold-vac-pvc",
  },
  spec: {
    accessModes: [
      "ReadWriteOnce",
    ],
    resources: {
      requests: {
        storage: "2Gi",
      },
    },
    storageClassName: ,
    volumeAttributesClassName: "gold", # change this to the name of the storage class you want to use
  },
}
