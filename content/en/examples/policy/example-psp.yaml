---
{
  apiVersion: "policy/v1beta1",
  kind: "PodSecurityPolicy",
  metadata: {
    name: "example",
  },
  spec: {
   # Don't allow privileged pods!
    privileged: false,
    # The rest fills in some required fields.
    seLinux: {
      rule: "RunAsAny",
    },
    supplementalGroups: {
      rule: "RunAsAny",
    },
    runAsUser: {
      rule: "RunAsAny",
    },
    fsGroup: {
      rule: "RunAsAny",
    },
    volumes: [
      "*",
    ],
  },
}
