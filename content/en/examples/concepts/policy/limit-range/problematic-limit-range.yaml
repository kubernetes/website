---
{
  apiVersion: "v1",
  kind: "LimitRange",
  metadata: {
    name: "cpu-resource-constraint",
  },
  spec: {
    limits: [{
      default: {
        cpu: "500m",
      }, # this section defines default limits
      defaultRequest: {
        cpu: "500m",
      }, # this section defines default requests
      max: {
        cpu: "1",
      }, # max and min define the limit range
      min: {
        cpu: "100m",
      },
      type: "Container",
    }],
  },
}
