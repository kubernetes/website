---
{
  apiVersion: "v1",
  kind: "LimitRange",
  metadata: {
    name: "cpu-resource-constraint",
  },
  spec: {
    limits: [{
      # define default limits
      default: {
        cpu: "500m",
      },
      # define default requests
      defaultRequest: {
        cpu: "500m",
      },
      # max and min define the limit range
      max: {
        cpu: "1",
      },
      min: {
        cpu: "100m",
      },
      type: "Container",
    }],
  },
}
