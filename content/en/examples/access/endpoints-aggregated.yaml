---
{
  apiVersion: "rbac.authorization.k8s.io/v1",
  kind: "ClusterRole",
  metadata: {
    annotations: {
      kubernetes.io/description: "\
         Add endpoints write permissions to the edit and admin roles. This was\n\
         removed by default in 1.22 because of CVE-2021-25740. See\n\
         https://issue.k8s.io/103675. This can allow writers to direct LoadBalancer\n\
         or Ingress implementations to expose backend IPs that would not otherwise\n\
         be accessible, and can circumvent network policies or security controls\n\
         intended to prevent/isolate access to those backends.\n\
         EndpointSlices were never included in the edit or admin roles, so there\n\
         is nothing to restore for the EndpointSlice API.\
        ",
    },
    labels: {
      rbac.authorization.k8s.io/aggregate-to-edit: "true",
    },
    name: "custom:aggregate-to-edit:endpoints", # you can change this if you wish
  },
  rules: [{
    apiGroups: [
      "",
    ],
    resources: [
      "endpoints",
    ],
    verbs: [
      "create",
      "delete",
      "deletecollection",
      "patch",
      "update",
    ],
  }],
}
