---
{
  apiVersion: "admissionregistration.k8s.io/v1",
  kind: "MutatingAdmissionPolicy",
  metadata: {
    name: "sidecar-policy.example.com",
  },
  spec: {
    paramKind: {
      kind: "Sidecar",
      apiVersion: "mutations.example.com/v1",
    },
    matchConstraints: {
      resourceRules: [{
        apiGroups: [
          "",
        ],
        apiVersions: [
          "v1",
        ],
        operations: [
          "CREATE",
        ],
        resources: [
          "pods",
        ],
      }],
    },
    matchConditions: [{
      name: "does-not-already-have-sidecar",
      expression: "!object.spec.initContainers.exists(ic, ic.name == \"mesh-proxy\")",
    }],
    failurePolicy: "Fail",
    reinvocationPolicy: "IfNeeded",
    mutations: [{
      patchType: "JSONPatch",
      jsonPatch: {
        expression: "\
           [\n\
          \  JSONPatch{\n\
          \    op: \"add\", path: \"/spec/initContainers/-\",\n\
          \    value: Object.spec.initContainers{\n\
          \      name: \"mesh-proxy\",\n\
          \      image: \"mesh-proxy/v1.0.0\",\n\
          \      restartPolicy: \"Always\"\n\
          \    }\n\
          \  }\n\
           ]\n\
          ",
      },
    }],
  },
}
