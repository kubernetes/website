---
{
  apiVersion: "v1",
  kind: "Pod",
  metadata: {
    name: "counter",
  },
  spec: {
    containers: [{
      name: "count",
      image: "busybox:1.28",
      args: [
        "/bin/sh",
        "-c",
        "\
           i=0; while true; do\n\
          \  echo \"$i: $(date)\" >> /var/log/1.log;\n\
          \  echo \"$(date) INFO $i\" >> /var/log/2.log;\n\
          \  i=$((i+1));\n\
          \  sleep 1;\n\
           done\n\
          ",
      ],
      volumeMounts: [{
        name: "varlog",
        mountPath: "/var/log",
      }],
    }],
    volumes: [{
      name: "varlog",
      emptyDir: {},
    }],
  },
}
