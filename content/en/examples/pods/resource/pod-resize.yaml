apiVersion: v1
kind: Pod
metadata:
  name: resize-demo
  namespace: rcr-example
spec:
  containers:
  - name: nginx
    image: nginx
    command: 
        - '/bin/bash'
        - '-c'
        - "baselineCPUs=$(cat /proc/self/status | grep Cpus_allowed_list | awk -F' ' '{print $2}'); currentCPUs=$(echo $baselineCPUs); echo \"Shared pool CPUs assigned during admission = $baselineCPUs\";while true; do assignedCPUs=$(cat /proc/self/status | grep Cpus_allowed_list | awk -F' ' '{print $2}') && if [[ \"$currentCPUs\" -ne \"$assignedCPUs\" ]]; then echo \"Shared pool CPUs changed from $currentCPUs to $assignedCPUs\";currentCPUs=$(echo $assignedCPUs);fi; done"
    resizePolicy:
    - resourceName: cpu
      restartPolicy: NotRequired # Default, but explicit here
    - resourceName: memory
      restartPolicy: RestartContainer
    resources:
      limits:
        memory: "200Mi"
        cpu: "700m"
      requests:
        memory: "200Mi"
        cpu: "700m"
