apiVersion: v1
kind: Pod
metadata:
  name: resize-exclusive-cpus-demo
  namespace: rcr-example
spec:
  containers:
  - name: nginx
    image: nginx
    command: 
        - '/bin/bash'
        - '-c'
        - "baselineCPUs=$(cat /proc/self/status | grep Cpus_allowed_list | awk -F' ' '{print $2}'); currentCPUs=$(echo $baselineCPUs); echo \"baseline CPUs = $baselineCPUs\";while true; do assignedCPUs=$(cat /proc/self/status | grep Cpus_allowed_list | awk -F' ' '{print $2}') && if [[ \"$currentCPUs\" -ne \"$assignedCPUs\" ]]; then echo \"assigned CPUs before resize = $currentCPUs, resized CPUs = $assignedCPUs\";currentCPUs=$(echo $assignedCPUs);fi; done"
    resizePolicy:
    - resourceName: cpu
      restartPolicy: NotRequired # Default, but explicit here
    resources:
      limits:
        memory: "200Mi"
        cpu: "2"
      requests:
        memory: "200Mi"
        cpu: "2"
