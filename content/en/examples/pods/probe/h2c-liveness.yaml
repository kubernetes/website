apiVersion: v1
kind: Pod
metadata:
  name: h2c-app
spec:
  containers:
  - name: app
    image: registry.k8s.io/e2e-test-images/agnhost:2.64.0
    command: ["/agnhost", "h2c-server", "--port=8080"]
    ports:
    - containerPort: 8080
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
        protocol: HTTP2
      initialDelaySeconds: 5
      periodSeconds: 10
