apiVersion: v1
kind: Pod
metadata:
  name: container-scope-mixed
  annotations:
    kubernetes.io/description: "A pod demonstrating container-level scope where one container gets exclusive resources and others run in the node's shared pool."
spec:
  # На рівні Podʼа запит Pod на CPU дорівнює лімітам, а запит на памʼять
  # також дорівнює лімітам памʼяті. Контейнер infrastructure-sidecar відповідає
  # вимогам класу QoS Guaranteed на рівні контейнера, а робочі
  # контейнери не вказують жодних запитів на ресурси. В області дії container
  # kubelet оцінює контейнери окремо для ексклюзивного виділення. Це
  # означає, що infrastructure-sidecar отримує ексклюзивну частку з 2 CPU, а
  # робочі контейнери працюють у загальному спільному пулі вузла, і все це в межах
  # загальних лімітів Podʼа.
  resources:
    requests:
      cpu: "4"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "4Gi"
  initContainers:
  - name: infrastructure-sidecar
    # Примітка: це образ-заповнювач для демонстрації, а не
    # справжній допоміжний інфраструктурний компонент.
    image: registry.k8s.io/pause:3.9
    restartPolicy: Always
    resources:
      requests:
        cpu: "2"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "2Gi"
  containers:
  - name: worker-1
    # Примітка: це образ-заповнювач для демонстрації.
    image: registry.k8s.io/pause:3.9
  - name: worker-2
    # Примітка: це образ-заповнювач для демонстрації.
    image: registry.k8s.io/pause:3.9
