apiVersion: v1
kind: Pod
metadata:
  name: secret-test-pod
spec:
  containers:
    - name: test-container
      image: nginx
      volumeMounts:
        # name має збігатися з назвою тому нижче
        - name: secret-volume
          mountPath: /etc/secret-volume
          readOnly: true
  # Дані Secret стають доступними контейнерам у Podʼі через том.
  volumes:
    - name: secret-volume
      secret:
        secretName: test-secret
