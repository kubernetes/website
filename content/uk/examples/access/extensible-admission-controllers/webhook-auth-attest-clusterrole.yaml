# ClusterRole, що надає дозвіл на атестацію для певної групи API
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: webhook-auth-attest-mygroup-example-com
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["admissionReviewAPIGroups"]
    resourceNames: ["mygroup.example.com"]
    verbs: ["attest"]
---
# Прив'язка ClusterRole до службового облікового запису, що використовується для отримання токена
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: webhook-auth-attest-mygroup-example-com-binding
subjects:
  - kind: ServiceAccount
    name: webhook-auth-sa
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: webhook-auth-attest-mygroup-example-com
  apiGroup: rbac.authorization.k8s.io
