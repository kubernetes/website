apiVersion: rbac.authorization.k8s.io/v1
# Цей RoleBinding дозволяє "jane" читати Podʼи в просторі імен "default".
# У цьому просторі імен уже має бути Role з назвою "pod-reader".
kind: RoleBinding
metadata:
  name: read-pods
  namespace: default
subjects:
# Можна вказати більше одного "subject"
- kind: User
  name: jane # "name" чутливе до регістру
  apiGroup: rbac.authorization.k8s.io
roleRef:
  # "roleRef" задає привʼязку до Role / ClusterRole
  kind: Role # має бути Role або ClusterRole
  name: pod-reader # має збігатися з назвою Role або ClusterRole, до якої ви хочете привʼязатися
  apiGroup: rbac.authorization.k8s.io
