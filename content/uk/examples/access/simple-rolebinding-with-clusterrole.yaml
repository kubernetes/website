apiVersion: rbac.authorization.k8s.io/v1
# Цей RoleBinding дозволяє "dave" читати Secret у просторі імен "development".
# ClusterRole з назвою "secret-reader" уже має існувати.
kind: RoleBinding
metadata:
  name: read-secrets
  #
  # Простір імен RoleBinding визначає, де надаються дозволи.
  # Це надає дозволи лише в просторі імен "development".
  namespace: development
subjects:
- kind: User
  name: dave # name чутливе до регістру
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
