apiVersion: rbac.authorization.k8s.io/v1
# Цей ClusterRoleBinding дозволяє будь-кому з групи "manager" читати Secret у будь-якому просторі імен.
kind: ClusterRoleBinding
metadata:
  name: read-secrets-global
subjects:
- kind: Group
  name: manager # name чутливе до регістру
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
