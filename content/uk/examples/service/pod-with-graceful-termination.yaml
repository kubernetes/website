apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      terminationGracePeriodSeconds: 120 # дуже довгий пільговий період
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        lifecycle:
          preStop:
            # Насправді завершення роботи може тривати будь-який час до terminationGracePeriodSeconds.
            # У цьому прикладі контейнер просто чекає щонайменше terminationGracePeriodSeconds,
            # а через 120 секунд його буде примусово завершено.
            # Зверніть увагу: весь цей час nginx продовжуватиме обробляти запити.
            sleep: 180
